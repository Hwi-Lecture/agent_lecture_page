<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>기준선 질문 기록</title>
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <main>
    <h1>자료 없이 질문하기</h1>
    <p>질문만 실제 모델에 입력한 뒤 응답을 기록합니다.</p>
    <label for="question">질문</label>
    <textarea id="question">신안보 분야 기업 풀은 몇 개사이며, 분야 중복은 어떻게 처리했나요?</textarea>
    <div class="actions"><button id="copy" type="button">질문 복사</button></div>
    <label for="model">사용한 모델과 검색 기능</label>
    <input id="model" placeholder="예: 모델 이름, 웹 검색 꺼짐">
    <label for="answer">모델 응답</label>
    <textarea id="answer" placeholder="실제 모델의 응답을 붙여 넣으세요."></textarea>
    <label for="note">관찰할 점</label>
    <textarea id="note" placeholder="확실하지 않은 수치나 출처 등을 적어 보세요."></textarea>
    <div class="actions"><button id="save" type="button">기록 저장</button></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="note">기록은 이 브라우저에 저장됩니다. 실습 화면이 모델을 호출하지는 않습니다.</p>
  </main>
  <script>
    const key = "lecture:baseline:u02";
    const fields = ["question", "model", "answer", "note"];
    const status = document.querySelector("#status");
    try {
      const saved = JSON.parse(localStorage.getItem(key) || "null");
      if (saved && typeof saved === "object") fields.forEach(id => { if (typeof saved[id] === "string") document.getElementById(id).value = saved[id]; });
    } catch (_) {}
    document.querySelector("#save").addEventListener("click", () => {
      const record = Object.fromEntries(fields.map(id => [id, document.getElementById(id).value]));
      try { localStorage.setItem(key, JSON.stringify(record)); status.textContent = "이 브라우저에 기록을 저장했습니다."; }
      catch (_) { status.textContent = "브라우저 저장이 막혔습니다. 내용을 따로 복사해 두세요."; }
    });
    document.querySelector("#copy").addEventListener("click", async () => {
      const input = document.querySelector("#question");
      try { await navigator.clipboard.writeText(input.value); status.textContent = "질문을 복사했습니다."; }
      catch (_) { input.focus(); input.select(); status.textContent = "선택된 질문을 직접 복사해 주세요."; }
    });
  </script>
</body>
</html>
