<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>첫 화면 시연</title>
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <main>
    <h1>첫 화면 시연</h1>
    <p>자연어로 만들 화면의 예시입니다. 제목을 바꿔 보세요.</p>
    <label for="title-input">화면 제목</label>
    <input id="title-input" value="정책자료 안내 챗봇">
    <div class="actions"><button id="apply" type="button">제목 바꾸기</button></div>
    <section class="panel">
      <h2 id="preview-title">정책자료 안내 챗봇</h2>
      <label for="preview-question">질문</label>
      <input id="preview-question" placeholder="궁금한 내용을 입력하세요">
      <p><strong>답변</strong><br>아직 모델이 연결되지 않았습니다.</p>
      <p><strong>출처</strong><br>답변에 사용할 자료의 출처가 여기에 표시됩니다.</p>
    </section>
    <p class="note">이 화면은 배치 확인용 시안입니다. 수업에서는 AI 코딩 도구에 화면을 요청한 뒤 실행 결과를 확인합니다.</p>
  </main>
  <script>
    document.querySelector("#apply").addEventListener("click", () => {
      document.querySelector("#preview-title").textContent = document.querySelector("#title-input").value.trim() || "정책자료 안내 챗봇";
    });
  </script>
</body>
</html>
