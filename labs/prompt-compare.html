<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>시스템 지시 전후 비교</title>
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <main>
    <h1>시스템 지시 전후 비교</h1>
    <p>같은 질문을 지시 없이 한 번, 시스템 지시를 적용해 한 번 입력합니다.</p>
    <label for="question">공통 질문</label>
    <textarea id="question">신안보 분야 기업 풀은 몇 개사이며, 분야 중복은 어떻게 처리했나요?</textarea>
    <div class="actions"><button id="copy-question" class="secondary" type="button">질문 복사</button></div>
    <label for="instruction">시스템 지시 예시</label>
    <textarea id="instruction">너는 정책자료 안내 도우미다. 제공된 자료에 근거해 답하고, 자료에 답이 없으면 모른다고 말한다. 답변 끝에 근거 자료의 제목과 날짜를 적는다.</textarea>
    <div class="actions"><button id="copy-instruction" class="secondary" type="button">지시 복사</button></div>
    <p class="note">도구에 시스템 지시 설정란이 있다면 그곳에 지시문을 넣습니다. 일반 대화창에 넣으면 사용자 지시로 전달됩니다. 자료는 아직 제공하지 않습니다.</p>
    <label for="before">지시 없이 받은 응답</label>
    <textarea id="before" placeholder="실제 모델의 응답을 기록하세요."></textarea>
    <label for="after">지시를 적용한 응답</label>
    <textarea id="after" placeholder="같은 질문에 대한 응답을 기록하세요."></textarea>
    <div class="actions"><button id="save" type="button">비교 기록 저장</button></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="note">같은 모델과 검색 설정으로 비교하세요. 기록은 이 브라우저에 저장되며 모델은 자동 호출되지 않습니다.</p>
  </main>
  <script>
    const key = "lecture:prompt-compare:u05";
    const fields = ["question", "instruction", "before", "after"];
    const status = document.querySelector("#status");
    try {
      const saved = JSON.parse(localStorage.getItem(key) || "null");
      if (saved && typeof saved === "object") fields.forEach(id => { if (typeof saved[id] === "string") document.getElementById(id).value = saved[id]; });
    } catch (_) {}
    document.querySelector("#save").addEventListener("click", () => {
      const record = Object.fromEntries(fields.map(id => [id, document.getElementById(id).value]));
      try { localStorage.setItem(key, JSON.stringify(record)); status.textContent = "이 브라우저에 비교 기록을 저장했습니다."; }
      catch (_) { status.textContent = "브라우저 저장이 막혔습니다. 내용을 따로 복사해 두세요."; }
    });
    async function copy(id) {
      const input = document.getElementById(id);
      try { await navigator.clipboard.writeText(input.value); status.textContent = "내용을 복사했습니다."; }
      catch (_) { input.focus(); input.select(); status.textContent = "선택된 내용을 직접 복사해 주세요."; }
    }
    document.querySelector("#copy-question").addEventListener("click", () => copy("question"));
    document.querySelector("#copy-instruction").addEventListener("click", () => copy("instruction"));
  </script>
</body>
</html>
